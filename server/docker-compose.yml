services:
  api:
    build: .
    env_file: .env
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    depends_on: [db, redis]
    ports: ["8000:8000"]
  worker:
    build: .
    env_file: .env
    command: celery -A config worker -l INFO
    depends_on: [db, redis]
  beat:
    build: .
    env_file: .env
    command: celery -A config beat -l INFO
    depends_on: [db, redis]
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: mydearpartner, POSTGRES_USER: mydearpartner, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}" }
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
volumes: { postgres_data: {} }
